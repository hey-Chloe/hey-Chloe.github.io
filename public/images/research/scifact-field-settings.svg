<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">SciFact BM25 field-setting comparison</title>
<desc id="desc">Merged-field nDCG@10 is 0.661835; separate fields 0.652560. Variant minus baseline is -0.009275. The exploratory 95 percent paired query bootstrap interval is [-0.026811, 0.007409] and crosses zero. This is an independent implementation on 300 judged queries; it is not a significance or generalization claim.</desc>

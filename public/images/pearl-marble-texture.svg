    <path d="M-80 390C156 351 258 256 360 162C454 76 523 20 625 -50" stroke-width="1.55" opacity="0.15" filter="url(#soft-vein)" />
    <path d="M-80 390C156 351 258 256 360 162C454 76 523 20 625 -50" stroke-width="0.54" opacity="0.23" />

    <path d="M1190 1022C1310 1004 1420 1012 1535 987" stroke="#746f66" stroke-width="0.55" opacity="0.1" />
    <path d="M1462 151C1515 143 1560 146 1618 134" stroke="#ffffff" stroke-width="0.72" opacity="0.11" />
    <path d="M520 1110C588 1101 642 1104 711 1090" stroke="#766f65" stroke-width="0.48" opacity="0.075" />
  </g>
</svg>

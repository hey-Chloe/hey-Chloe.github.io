<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" fill="none">
  <defs>
    <filter id="mineral-cloud" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.012" numOctaves="4" seed="23" stitchTiles="stitch" />
      <feGaussianBlur stdDeviation="1.6 0.45" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.2" intercept="0.62" />
        <feFuncG type="linear" slope="0.2" intercept="0.65" />
        <feFuncB type="linear" slope="0.2" intercept="0.64" />
        <feFuncA type="table" tableValues="0.025 0.055" />
      </feComponentTransfer>
    </filter>
    <filter id="soft-vein" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
    <filter id="wide-vein" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="frost-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.46" numOctaves="3" seed="41" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.34
        0 0 0 0 0.35
        0 0 0 0 0.34
        0 0 0 0.13 0" />
    </filter>
    <filter id="matte-cloud" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.072" numOctaves="3" seed="17" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.43
        0 0 0 0 0.42
        0 0 0 0 0.39
        0 0 0 0.11 0" />
    </filter>
    <filter id="soft-patina" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="58" />
    </filter>
    <radialGradient id="edge-patina" cx="50%" cy="45%" r="72%">
      <stop offset="48%" stop-color="#8f8779" stop-opacity="0" />
      <stop offset="100%" stop-color="#8f8779" stop-opacity="0.085" />
    </radialGradient>
    <pattern id="frost-speckle" width="164" height="148" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <g fill="#666863">
        <circle cx="8" cy="17" r="0.7" opacity="0.2" />
        <circle cx="29" cy="43" r="0.45" opacity="0.14" />
        <circle cx="51" cy="12" r="0.5" opacity="0.19" />
        <circle cx="76" cy="61" r="0.72" opacity="0.13" />
        <circle cx="104" cy="29" r="0.42" opacity="0.2" />
        <circle cx="139" cy="9" r="0.66" opacity="0.13" />
        <circle cx="157" cy="54" r="0.46" opacity="0.18" />
        <circle cx="18" cy="92" r="0.52" opacity="0.16" />
        <circle cx="45" cy="126" r="0.74" opacity="0.12" />
        <circle cx="69" cy="101" r="0.4" opacity="0.2" />
        <circle cx="92" cy="139" r="0.58" opacity="0.15" />
        <circle cx="122" cy="84" r="0.68" opacity="0.12" />
        <circle cx="151" cy="119" r="0.42" opacity="0.19" />
      </g>
      <g fill="#ffffff">
        <circle cx="18" cy="58" r="0.55" opacity="0.3" />
        <circle cx="59" cy="77" r="0.44" opacity="0.24" />
        <circle cx="88" cy="18" r="0.62" opacity="0.22" />
        <circle cx="113" cy="118" r="0.48" opacity="0.27" />
        <circle cx="145" cy="72" r="0.58" opacity="0.2" />
      </g>
    </pattern>
  </defs>

  <rect width="1800" height="1200" filter="url(#mineral-cloud)" opacity="0.72" />
  <rect width="1800" height="1200" filter="url(#matte-cloud)" opacity="0.58" style="mix-blend-mode:multiply" />
  <rect width="1800" height="1200" filter="url(#frost-grain)" opacity="0.62" style="mix-blend-mode:multiply" />
  <rect width="1800" height="1200" fill="url(#frost-speckle)" opacity="0.72" style="mix-blend-mode:multiply" />
  <rect width="1800" height="1200" fill="url(#edge-patina)" />

  <g fill="#b2a38d" filter="url(#soft-patina)" opacity="0.055">
    <ellipse cx="220" cy="170" rx="260" ry="145" />
    <ellipse cx="1510" cy="985" rx="310" ry="165" />
    <ellipse cx="1045" cy="255" rx="210" ry="120" />
  </g>

